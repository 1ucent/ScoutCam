name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest   # newest macOS + Xcode available on GitHub
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild -project ScoutCam.xcodeproj -scheme ScoutCam \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/ScoutCam.app Payload/
          zip -qry ScoutCam.ipa Payload
          ls -la ScoutCam.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ScoutCam.ipa
          path: ScoutCam.ipa
          retention-days: 14
